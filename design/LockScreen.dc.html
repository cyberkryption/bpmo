<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="styles.css"></helmet>
<div style="display:flex;flex-direction:column;height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 32px 8px;text-align:center">
    <div class="blueprint" style="width:64px;height:64px;display:grid;place-items:center;color:var(--color-accent)">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-family:var(--font-heading);font-weight:600;font-size:36px;line-height:1.1">Vitals locked</div>
      <div style="font-size:15px;color:color-mix(in srgb,var(--color-text) 65%,transparent);max-width:280px;text-wrap:pretty">Your readings and photos are private. Unlock to continue.</div>
    </div>
    <button onClick="{{ onTap }}" aria-label="Unlock with fingerprint" style="position:relative;width:112px;height:112px;display:grid;place-items:center;background:transparent;color:{{ ringColor }};border:1.5px solid {{ ringColor }};cursor:pointer">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg>
      <sc-if value="{{ scanning }}" hint-placeholder-val="{{ false }}"><i style="position:absolute;left:0;right:0;top:50%;height:2px;background:var(--color-accent)"></i></sc-if>
    </button>
    <div style="min-height:44px;display:flex;flex-direction:column;gap:4px;align-items:center">
      <div style="font-family:var(--font-heading);font-weight:600;font-size:18px;color:{{ msgColor }}">{{ msg }}</div>
      <div style="font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)">{{ sub }}</div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;padding:0 24px 24px">
    <button style="min-height:52px;background:transparent;color:var(--color-text);border:1px solid var(--color-divider);font-family:var(--font-heading);font-weight:600;font-size:16px;cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 7%,transparent)">Use device PIN / pattern</button>
    <div style="font-size:12px;text-align:center;color:color-mix(in srgb,var(--color-text) 55%,transparent)">Re-locks after {{ timeout }} in background</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:820},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;scanning&quot;,&quot;failed&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;'idle'|'scanning'|'failed'&quot;,&quot;section&quot;:&quot;State&quot;},&quot;timeout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;immediately&quot;,&quot;1 minute&quot;,&quot;5 minutes&quot;],&quot;default&quot;:&quot;1 minute&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Security&quot;}}">
class Component extends DCLogic {
  state = { s: this.props.status || 'idle' };
  componentDidUpdate(p) { if (p.status !== this.props.status && this.props.status) this.setState({ s: this.props.status }); }
  renderVals() {
    const s = this.state.s;
    const M = {
      idle: ['Touch the sensor', 'Fingerprint or face', 'var(--color-text)', 'var(--color-accent)'],
      scanning: ['Scanning…', 'Hold still', 'var(--color-accent-700)', 'var(--color-accent)'],
      failed: ['Not recognised', '2 attempts left, then PIN', 'var(--st-stage2-ink)', 'var(--st-stage2)']
    }[s];
    return {
      msg: M[0], sub: M[1], msgColor: M[2], ringColor: M[3], scanning: s === 'scanning',
      timeout: this.props.timeout || '1 minute',
      onTap: () => this.setState({ s: s === 'idle' ? 'scanning' : s === 'scanning' ? 'failed' : 'idle' })
    };
  }
}
</script>
</body>
</html>
