<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="styles.css"></helmet>
<div style="position:relative;display:flex;flex-direction:column;height:100%;background:#0e1012;color:#eef0f2;font-family:var(--font-body);overflow:hidden">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px)"></div>
  <span style="position:absolute;left:20px;bottom:200px;font-family:ui-monospace,monospace;font-size:11px;color:rgba(238,240,242,.5)">live camera preview</span>
  <header style="position:relative;display:flex;align-items:center;gap:8px;padding:8px 8px 0">
    <button aria-label="Close" style="width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;color:inherit;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <div style="flex:1"></div>
    <button aria-label="Flash" style="width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;color:inherit;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></button>
  </header>
  <div style="position:relative;display:flex;justify-content:center;padding:4px 20px">
    <div style="display:flex;border:1px solid rgba(238,240,242,.35);background:rgba(14,16,18,.6)">
      <button onClick="{{ setBp }}" style="min-height:40px;padding:0 14px;border:0;font:inherit;font-size:13px;cursor:pointer;background:{{ bpBg }};color:{{ bpFg }}">BP monitor</button>
      <button onClick="{{ setOx }}" style="min-height:40px;padding:0 14px;border:0;border-left:1px solid rgba(238,240,242,.35);font:inherit;font-size:13px;cursor:pointer;background:{{ oxBg }};color:{{ oxFg }}">Oximeter</button>
    </div>
  </div>
  <div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 40px">
    <div class="blueprint" style="width:100%;max-width:300px;aspect-ratio:{{ frameRatio }};border:1.5px solid #9ec3ea;color:#9ec3ea">
      <i class="corner tl" style="color:#9ec3ea;width:22px;height:22px"></i><i class="corner tr" style="color:#9ec3ea;width:22px;height:22px"></i><i class="corner bl" style="color:#9ec3ea;width:22px;height:22px"></i><i class="corner br" style="color:#9ec3ea;width:22px;height:22px"></i>
    </div>
    <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(14,16,18,.75);border:1px solid rgba(158,195,234,.5);font-size:13px">
      <i style="width:8px;height:8px;background:#7fd1a0"></i>{{ detected }}
    </div>
    <div style="font-size:13px;color:rgba(238,240,242,.75);text-align:center">Fit the display inside the frame. Avoid glare.</div>
  </div>
  <footer style="position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 28px 28px;background:rgba(14,16,18,.85)">
    <button aria-label="Import from gallery" style="justify-self:start;width:52px;height:52px;display:grid;place-items:center;background:transparent;border:1px solid rgba(238,240,242,.35);color:inherit;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg></button>
    <button aria-label="Capture" style="width:76px;height:76px;display:grid;place-items:center;background:transparent;border:2px solid #eef0f2;cursor:pointer">
      <span style="width:60px;height:60px;background:#9ec3ea"></span>
    </button>
    <span style="justify-self:end;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(238,240,242,.6)">Auto</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:820}}">
class Component extends DCLogic {
  state = { mode: 'bp' };
  renderVals() {
    const bp = this.state.mode === 'bp';
    return {
      setBp: () => this.setState({ mode: 'bp' }), setOx: () => this.setState({ mode: 'ox' }),
      bpBg: bp ? '#9ec3ea' : 'transparent', bpFg: bp ? '#0e1012' : '#eef0f2',
      oxBg: bp ? 'transparent' : '#9ec3ea', oxFg: bp ? '#eef0f2' : '#0e1012',
      frameRatio: bp ? '3 / 4' : '16 / 9',
      detected: bp ? 'Display found · 127 / 80 · 71' : 'Display found · 97% · 68'
    };
  }
}
</script>
</body>
</html>
