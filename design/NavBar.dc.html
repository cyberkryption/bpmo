<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="styles.css"></helmet>
<sc-if value="{{ isRail }}" hint-placeholder-val="{{ false }}">
  <nav style="width:88px;height:100%;display:flex;flex-direction:column;align-items:center;gap:28px;padding:20px 0;background:var(--color-bg);color:var(--color-text);border-right:1px solid var(--color-divider);font-family:var(--font-body)">
    <button aria-label="Scan reading" class="blueprint" style="width:56px;height:56px;display:grid;place-items:center;background:var(--color-accent);color:var(--color-bg);border:1px solid var(--color-accent);cursor:pointer">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
    </button>
    <div style="display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:{{ it.weight }}">
          <span style="width:56px;height:32px;display:grid;place-items:center;background:{{ it.pill }};color:{{ it.fg }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg></span>{{ it.label }}
        </div>
      </sc-for>
    </div>
  </nav>
</sc-if>
<sc-if value="{{ isBar }}" hint-placeholder-val="{{ true }}">
  <nav style="height:80px;display:flex;align-items:center;justify-content:space-around;background:var(--color-bg);color:var(--color-text);border-top:1px solid var(--color-divider);font-family:var(--font-body)">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:{{ it.weight }}">
        <span style="width:64px;height:32px;display:grid;place-items:center;background:{{ it.pill }};color:{{ it.fg }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg></span>{{ it.label }}
      </div>
    </sc-for>
  </nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;history&quot;,&quot;trends&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'history'|'trends'&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bar&quot;,&quot;rail&quot;],&quot;default&quot;:&quot;bar&quot;,&quot;tsType&quot;:&quot;'bar'|'rail'&quot;}}">
const ITEMS = [
  { k: 'home', label: 'Today', icon: 'M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
  { k: 'history', label: 'History', icon: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01' },
  { k: 'trends', label: 'Trends', icon: 'M3 3v18h18M19 9l-5 5-4-4-3 3' }
];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home', rail = this.props.variant === 'rail';
    return {
      isRail: rail, isBar: !rail,
      items: ITEMS.map(i => ({ label: i.label, icon: i.icon, pill: i.k === a ? 'var(--color-accent-100)' : 'transparent', fg: i.k === a ? 'var(--color-accent-800)' : 'currentColor', weight: i.k === a ? 600 : 400 }))
    };
  }
}
</script>
</body>
</html>
