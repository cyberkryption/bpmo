<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="styles.css"></helmet>
<div style="display:flex;flex-direction:column;height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 12px 4px 4px">
    <button aria-label="Close" style="width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;color:inherit;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <div style="flex:1;font-family:var(--font-heading);font-weight:600;font-size:22px">Import photos</div>
    <span style="font-size:13px;color:color-mix(in srgb,var(--color-text) 65%,transparent);font-variant-numeric:tabular-nums">{{ countLabel }}</span>
  </header>
  <div style="padding:4px 20px 12px;font-size:13px;color:color-mix(in srgb,var(--color-text) 65%,transparent)">Readings are dated from each photo's EXIF timestamp.</div>
  <div style="flex:1;overflow:auto;padding:0 20px 20px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <div style="padding:12px 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)">{{ g.title }}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px">
        <sc-for list="{{ g.items }}" as="p" hint-placeholder-count="6">
          <button onClick="{{ p.onClick }}" style="position:relative;aspect-ratio:1;padding:0;cursor:pointer;border:{{ p.border }};background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--color-text) 8%,transparent) 0 5px,transparent 5px 10px);color:var(--color-text);font:inherit">
            <span style="position:absolute;left:6px;top:6px;font-family:ui-monospace,monospace;font-size:9px;color:color-mix(in srgb,var(--color-text) 55%,transparent)">{{ p.kind }}</span>
            <span style="position:absolute;right:6px;top:6px;width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid {{ p.badgeBorder }};background:{{ p.badgeBg }};color:var(--color-bg)">{{ p.order }}</span>
            <span style="position:absolute;left:0;right:0;bottom:0;padding:4px 6px;text-align:left;font-size:11px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--color-bg) 82%,transparent);color:{{ p.timeColor }}">{{ p.time }}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <footer style="display:flex;align-items:center;gap:12px;padding:12px 20px 16px;border-top:1px solid var(--color-divider)">
    <div style="flex:1;font-size:12px;line-height:1.35;color:color-mix(in srgb,var(--color-text) 65%,transparent)">{{ footNote }}</div>
    <button class="blueprint" style="min-height:52px;padding:0 22px;display:flex;align-items:center;gap:8px;background:var(--color-accent);color:var(--color-bg);border:1px solid var(--color-accent);font-family:var(--font-heading);font-weight:600;font-size:17px;cursor:pointer" style-hover="background:var(--color-accent-600)">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>{{ cta }}
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:820}}">
const PHOTOS = [
  { id: 1, g: 'This week', kind: 'BP', time: 'Tue 08:14', exif: true },
  { id: 2, g: 'This week', kind: 'SPO2', time: 'Tue 07:52', exif: true },
  { id: 3, g: 'This week', kind: 'BP', time: 'Mon 21:30', exif: true },
  { id: 4, g: 'This week', kind: 'PHOTO', time: 'Mon 12:05', exif: true },
  { id: 5, g: 'This week', kind: 'BP', time: 'Sun 09:02', exif: true },
  { id: 6, g: 'This week', kind: 'SPO2', time: 'Sat 22:40', exif: true },
  { id: 7, g: 'Earlier', kind: 'BP', time: 'No date', exif: false },
  { id: 8, g: 'Earlier', kind: 'BP', time: '28 Sep 08:20', exif: true },
  { id: 9, g: 'Earlier', kind: 'SPO2', time: '27 Sep 19:11', exif: true }
];

class Component extends DCLogic {
  state = { sel: [3, 5, 7] };
  toggle(id) { this.setState(s => ({ sel: s.sel.includes(id) ? s.sel.filter(x => x !== id) : s.sel.concat(id) })); }
  renderVals() {
    const sel = this.state.sel;
    const noDate = PHOTOS.filter(p => sel.includes(p.id) && !p.exif).length;
    const item = p => {
      const i = sel.indexOf(p.id), on = i > -1;
      return {
        kind: p.kind, time: p.time, order: on ? i + 1 : '', onClick: () => this.toggle(p.id),
        border: on ? '2px solid var(--color-accent)' : '1px solid var(--color-divider)',
        badgeBorder: on ? 'var(--color-accent)' : 'color-mix(in srgb, var(--color-text) 45%, transparent)',
        badgeBg: on ? 'var(--color-accent)' : 'color-mix(in srgb, var(--color-bg) 60%, transparent)',
        timeColor: p.exif ? 'var(--color-text)' : 'var(--st-stage1-ink)'
      };
    };
    return {
      countLabel: `${sel.length} selected`,
      cta: sel.length ? `Review ${sel.length}` : 'Select photos',
      footNote: noDate ? `${noDate} photo has no EXIF date — you'll set it during review.` : 'Each photo opens in review before saving.',
      groups: ['This week', 'Earlier'].map(title => ({ title, items: PHOTOS.filter(p => p.g === title).map(item) }))
    };
  }
}
</script>
</body>
</html>
