<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="styles.css"></helmet>
<div style="display:flex;flex-direction:column;height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 12px 8px 4px">
    <button aria-label="Back" style="width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;color:inherit;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></button>
    <div style="flex:1;font-family:var(--font-heading);font-weight:600;font-size:22px">Review reading</div>
    <span style="font-family:var(--font-heading);font-weight:600;font-size:15px;color:var(--color-accent-700);font-variant-numeric:tabular-nums">1 of 3</span>
  </header>
  <div style="display:flex;gap:3px;padding:0 20px">
    <i style="flex:1;height:3px;background:var(--color-accent)"></i><i style="flex:1;height:3px;background:var(--color-divider)"></i><i style="flex:1;height:3px;background:var(--color-divider)"></i>
  </div>
  <div style="flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px">
    <figure class="blueprint" style="position:relative;aspect-ratio:4/3;margin:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--color-text) 7%,transparent) 0 6px,transparent 6px 12px)">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <span style="position:absolute;left:10px;top:8px;font-family:ui-monospace,monospace;font-size:11px;color:color-mix(in srgb,var(--color-text) 60%,transparent)">photo of BP monitor display</span>
      <div style="position:absolute;left:30%;top:20%;width:40%;height:22%;border:1.5px solid var(--color-accent)"><span style="position:absolute;left:-1px;top:-18px;font-size:10px;letter-spacing:.08em;padding:1px 4px;background:var(--color-accent);color:var(--color-bg)">SYS</span></div>
      <div style="position:absolute;left:30%;top:46%;width:40%;height:22%;border:1.5px dashed var(--st-stage1)"><span style="position:absolute;left:-1px;top:-18px;font-size:10px;letter-spacing:.08em;padding:1px 4px;background:var(--st-stage1);color:#fff">DIA</span></div>
      <div style="position:absolute;left:52%;top:74%;width:18%;height:14%;border:1.5px solid var(--color-accent)"><span style="position:absolute;right:-1px;top:-18px;font-size:10px;letter-spacing:.08em;padding:1px 4px;background:var(--color-accent);color:var(--color-bg)">PUL</span></div>
    </figure>

    <div style="display:flex;border:1px solid var(--color-divider)">
      <button style="flex:1;min-height:44px;border:0;font:inherit;font-size:13px;background:var(--color-accent);color:var(--color-bg);cursor:pointer">Blood pressure</button>
      <button style="flex:1;min-height:44px;border:0;border-left:1px solid var(--color-divider);font:inherit;font-size:13px;background:transparent;color:var(--color-text);cursor:pointer">Oximeter</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
      <label style="display:flex;flex-direction:column;gap:5px">
        <span style="font-size:12px;color:color-mix(in srgb,var(--color-text) 70%,transparent)">Systolic</span>
        <input value="{{ sys }}" onChange="{{ onSys }}" inputMode="numeric" style="width:100%;min-height:56px;padding:0 10px;font-family:var(--font-heading);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0;outline:none"></input>
        <span style="font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)">mmHg · 98%</span>
      </label>
      <label style="display:flex;flex-direction:column;gap:5px">
        <span style="font-size:12px;color:var(--st-stage1-ink)">Diastolic</span>
        <input value="{{ dia }}" onChange="{{ onDia }}" inputMode="numeric" style="width:100%;min-height:56px;padding:0 10px;font-family:var(--font-heading);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;color:var(--color-text);background:color-mix(in oklch,var(--st-stage1) 10%,var(--color-surface));border:1.5px solid var(--st-stage1);border-radius:0;outline:none"></input>
        <span style="font-size:11px;color:var(--st-stage1-ink)">mmHg · 64% check</span>
      </label>
      <label style="display:flex;flex-direction:column;gap:5px">
        <span style="font-size:12px;color:color-mix(in srgb,var(--color-text) 70%,transparent)">Pulse</span>
        <input value="{{ pul }}" onChange="{{ onPul }}" inputMode="numeric" style="width:100%;min-height:56px;padding:0 10px;font-family:var(--font-heading);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0;outline:none"></input>
        <span style="font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)">bpm · 96%</span>
      </label>
    </div>

    <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:color-mix(in oklch,var(--st-stage1) 12%,transparent);color:var(--st-stage1-ink);font-size:13px;line-height:1.4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <span>Diastolic was hard to read. Compare with the photo and correct if needed.</span>
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:color-mix(in srgb,var(--color-text) 70%,transparent)">Category</span>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;background:{{ catTag.bg }};color:{{ catTag.fg }}"><i style="width:6px;height:6px;background:{{ catTag.dot }}"></i>{{ catTag.label }}</span>
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:500">Tue 20 Oct 2026, 08:14</div>
        <div style="font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent)">From photo EXIF · DateTimeOriginal</div>
      </div>
      <button style="min-height:40px;padding:0 10px;background:transparent;border:0;font-family:var(--font-heading);font-weight:600;font-size:15px;color:var(--color-accent-700);cursor:pointer">Change</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;color:color-mix(in srgb,var(--color-text) 70%,transparent)">Note</span>
      <textarea value="{{ note }}" onChange="{{ onNote }}" placeholder="How were you feeling? Arm, posture, meds…" style="width:100%;min-height:76px;padding:10px;font:inherit;font-size:14px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0;resize:vertical;outline:none"></textarea>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
          <button onClick="{{ c.onClick }}" style="min-height:36px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;border:1px solid {{ c.border }};background:{{ c.bg }};color:var(--color-text)">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>
  </div>
  <footer style="display:flex;gap:12px;padding:12px 20px 16px;border-top:1px solid var(--color-divider);background:var(--color-bg)">
    <button style="min-height:52px;padding:0 20px;background:transparent;color:var(--color-text);border:1px solid var(--color-divider);font-family:var(--font-heading);font-weight:600;font-size:16px;cursor:pointer">Skip</button>
    <button class="blueprint" style="flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--color-accent);color:var(--color-bg);border:1px solid var(--color-accent);font-family:var(--font-heading);font-weight:600;font-size:17px;cursor:pointer" style-hover="background:var(--color-accent-600)">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Save &amp; next
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:820}}">
const bpCat = (s, d) => s > 180 || d > 120 ? 'crisis' : s >= 140 || d >= 90 ? 'stage2' : s >= 130 || d >= 80 ? 'stage1' : s >= 120 ? 'elevated' : 'normal';
const LABEL = { normal:'Normal', elevated:'Elevated', stage1:'Stage 1 hypertension', stage2:'Stage 2 hypertension', crisis:'Hypertensive crisis' };
const CHIPS = ['Before meds', 'After meds', 'Left arm', 'After exercise', 'Stressed'];

class Component extends DCLogic {
  state = { sys: '127', dia: '80', pul: '71', note: 'Before morning meds', picked: ['Before meds'] };
  toggle(label) {
    this.setState(s => {
      const picked = s.picked.includes(label) ? s.picked.filter(x => x !== label) : s.picked.concat(label);
      return { picked, note: picked.join(' · ') };
    });
  }
  renderVals() {
    const c = bpCat(+this.state.sys || 0, +this.state.dia || 0);
    return {
      sys: this.state.sys, dia: this.state.dia, pul: this.state.pul, note: this.state.note,
      onSys: e => this.setState({ sys: e.target.value }), onDia: e => this.setState({ dia: e.target.value }),
      onPul: e => this.setState({ pul: e.target.value }), onNote: e => this.setState({ note: e.target.value }),
      catTag: { label: LABEL[c], bg: `color-mix(in oklch, var(--st-${c}) 18%, transparent)`, fg: `var(--st-${c}-ink)`, dot: `var(--st-${c})` },
      chips: CHIPS.map(label => {
        const on = this.state.picked.includes(label);
        return { label, onClick: () => this.toggle(label), border: on ? 'var(--color-accent)' : 'var(--color-divider)', bg: on ? 'var(--color-accent-100)' : 'transparent' };
      })
    };
  }
}
</script>
</body>
</html>
