name: Screenshots

# Renders the app's screens with Robolectric into docs/screenshots and commits any that
# changed back to the branch, so the README always shows the current UI.
on:
  push:
    branches: ["claude/**"]
    paths:
      - "app/**"
      - "core/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: ./gradlew :app:testDebugUnitTest -Pscreenshots --stacktrace

      - name: Commit changed screenshots
        # Keep whatever rendered, even if a screen failed, so it can be looked at.
        if: always() && github.ref != 'refs/heads/main'
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshots"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
